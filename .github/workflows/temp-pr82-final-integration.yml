name: Temporary PR82 final integrated-head validation

on:
  push:
    branches:
      - integration/review-pr82-on-current-stack
    paths:
      - .github/workflows/temp-pr82-final-integration.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/review-pr82-on-current-stack
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove clean integrated PR82 head
        shell: bash
        run: |
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor 92388ad7850edd3933ebdf2325afcd014fead225 HEAD
          echo "PR82 head is integrated in this exact checkout."
      - name: Install repository and test dependencies
        run: |
          python -m pip install -q -r requirements.txt
          python -m pip install -q pytest
      - name: Run focused isolation regressions
        run: python -m pytest -q tests/test_repo_hygiene.py tests/test_vector_ingest_hygiene.py
      - name: Run full pytest regression
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --tb=short -ra 2>&1 | tee pr82-full-pytest.log
      - name: Run legacy strict research-engine regression
        shell: bash
        run: |
          set -o pipefail
          python test_research_engine.py 2>&1 | tee pr82-legacy.log
      - name: Upload validation receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr82-integrated-head-${{ github.run_id }}
          path: |
            pr82-full-pytest.log
            pr82-legacy.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Confirm clean exact head
        shell: bash
        run: |
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor 92388ad7850edd3933ebdf2325afcd014fead225 HEAD
          echo "PR82 integrated-head validation passed."
