name: Temporary PR82 final gated integration

on:
  push:
    branches:
      - integration/review-pr82-on-current-stack
    paths:
      - .github/workflows/temp-pr82-final-integration.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/review-pr82-on-current-stack
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove historical PR82 head is already integrated and checkout is clean
        shell: bash
        run: |
          git fetch origin codex/answer-scope-20260908
          git merge-base --is-ancestor 92388ad7850edd3933ebdf2325afcd014fead225 HEAD
          test -z "$(git status --porcelain)"
      - name: Install repository and test dependencies
        run: |
          python -m pip install -q -r requirements.txt
          python -m pip install -q pytest
      - name: Run focused isolation regressions
        run: python -m pytest -q tests/test_repo_hygiene.py tests/test_vector_ingest_hygiene.py
      - name: Run full pytest regression
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --tb=short -ra 2>&1 | tee integration-pytest.log
      - name: Upload pytest receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr82-final-pytest-${{ github.run_id }}
          path: integration-pytest.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Run legacy strict research-engine regression
        shell: bash
        run: |
          set -o pipefail
          python test_research_engine.py 2>&1 | tee integration-legacy.log
      - name: Upload legacy receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr82-final-legacy-${{ github.run_id }}
          path: integration-legacy.log
          if-no-files-found: ignore
          retention-days: 3
