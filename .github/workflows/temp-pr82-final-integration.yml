name: Temporary PR82 final gated integration

on:
  push:
    branches:
      - integration/review-pr82-on-current-stack
    paths:
      - .github/workflows/temp-pr82-final-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/review-pr82-on-current-stack
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create clean local PR82 merge candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test -z "$(git status --porcelain)"
          if git merge-base --is-ancestor 92388ad7850edd3933ebdf2325afcd014fead225 HEAD; then
            echo "PR82 already integrated before validation" >&2
            exit 2
          fi
          git fetch origin codex/answer-scope-20260908
          git merge --no-commit --no-ff origin/codex/answer-scope-20260908
          test -z "$(git diff --name-only --diff-filter=U)"
          git commit -m "merge: integrate validated PR82 fixes into current stack"
          test -z "$(git status --porcelain)"
      - name: Install repository and test dependencies
        run: |
          python -m pip install -q -r requirements.txt
          python -m pip install -q pytest
      - name: Run focused isolation regressions
        run: python -m pytest -q tests/test_repo_hygiene.py tests/test_vector_ingest_hygiene.py
      - name: Run full pytest regression
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --tb=short -ra 2>&1 | tee pr82-full-pytest.log
      - name: Run legacy strict research-engine regression
        shell: bash
        run: |
          set -o pipefail
          python test_research_engine.py 2>&1 | tee pr82-legacy.log
      - name: Upload validation receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr82-final-integration-${{ github.run_id }}
          path: |
            pr82-full-pytest.log
            pr82-legacy.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Push only validated integration merge
        shell: bash
        run: git push origin HEAD:integration/review-pr82-on-current-stack
