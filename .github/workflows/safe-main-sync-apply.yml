name: Safe main sync apply

on:
  push:
    branches: [chatgpt-max-maturity-wave1-20260827]

permissions:
  contents: write

concurrency:
  group: safe-main-sync-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  merge-main:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head with history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Guarded merge of current main
        shell: bash
        run: |
          set -euo pipefail
          branch="chatgpt-max-maturity-wave1-20260827"
          start_head="$(git rev-parse HEAD)"
          git config user.name "safe-main-sync"
          git config user.email "safe-main-sync@users.noreply.github.com"
          git fetch --no-tags origin main "$branch"
          main_head="$(git rev-parse origin/main)"

          echo "START_HEAD=${start_head}"
          echo "MAIN_HEAD=${main_head}"
          echo "MERGE_BASE=$(git merge-base HEAD origin/main)"

          if git merge-base --is-ancestor origin/main HEAD; then
            echo "main is already contained in branch; nothing to do"
            exit 0
          fi

          set +e
          git merge --no-commit --no-ff origin/main
          rc=$?
          set -e

          if [ "$rc" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'conflicts=%s\n' "${conflicts[*]:-}"
            if [ "${#conflicts[@]}" -ne 1 ] || [ "${conflicts[0]}" != "research_engine/lab.py" ]; then
              echo "Unexpected merge conflict set; refusing to auto-resolve" >&2
              git merge --abort || true
              exit 1
            fi

            python - <<'PY'
          from pathlib import Path

          path = Path("research_engine/lab.py")
          text = path.read_text(encoding="utf-8")

          block1 = '''<<<<<<< HEAD
          from . import simulation_lab
          =======
          # #171e — exam/padhai ka naapne wala saamaan wahin rehta hai jahan uska parse
          # hota hai (`exammodel.py` leaf module hai: ye planner/discovery ko import nahi
          # karta, isliye koi cycle nahi banta). Lab yahan sirf CHALATA hai — split ka
          # hisaab exammodel ka hai, aur "kitna kaafi hai" ki chhat bhi wahin se aati hai.
          from . import exammodel
          >>>>>>> origin/main'''
          merged1 = '''from . import simulation_lab
          # #171e — exam/padhai ka naapne wala saamaan wahin rehta hai jahan uska parse
          # hota hai (`exammodel.py` leaf module hai: ye planner/discovery ko import nahi
          # karta, isliye koi cycle nahi banta). Lab yahan sirf CHALATA hai — split ka
          # hisaab exammodel ka hai, aur "kitna kaafi hai" ki chhat bhi wahin se aati hai.
          from . import exammodel'''

          block2 = '''<<<<<<< HEAD
              stress_test: Dict[str, Any] = field(default_factory=dict)
          =======
              # #150g — NAAPE hue numbers, string me nahi. `observed` ek insaan ke padhne
              # ki line hai; usko wapas parse karke faisla lena hi "declare vs derive" ka
              # ulta rasta hai. Jise numbers par grade karna hai (jaise trademodel ke
              # contract point) wo yahan se le, line se nahi. Khaali dict ka matlab: is
              # recipe ne koi structured naap nahi di.
              numbers: Dict[str, Any] = field(default_factory=dict)
          >>>>>>> origin/main'''
          merged2 = '''    stress_test: Dict[str, Any] = field(default_factory=dict)
              # #150g — NAAPE hue numbers, string me nahi. `observed` ek insaan ke padhne
              # ki line hai; usko wapas parse karke faisla lena hi "declare vs derive" ka
              # ulta rasta hai. Jise numbers par grade karna hai (jaise trademodel ke
              # contract point) wo yahan se le, line se nahi. Khaali dict ka matlab: is
              # recipe ne koi structured naap nahi di.
              numbers: Dict[str, Any] = field(default_factory=dict)'''

          block3 = '''<<<<<<< HEAD
                      "stress_test": dict(self.stress_test),
          =======
                      "numbers": dict(self.numbers),
          >>>>>>> origin/main'''
          merged3 = '''            "stress_test": dict(self.stress_test),
                      "numbers": dict(self.numbers),'''

          replacements = [(block1, merged1), (block2, merged2), (block3, merged3)]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one known conflict block, got {text.count(old)}")
              text = text.replace(old, new, 1)

          if "<<<<<<< " in text or "=======" in text or ">>>>>>> " in text:
              raise SystemExit("Conflict markers remain after guarded resolution")
          path.write_text(text, encoding="utf-8")
          PY

            git add research_engine/lab.py
          fi

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved conflicts remain" >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

          python -m compileall -q research_engine
          python -m pytest -q \
            tests/test_lab_advanced.py \
            tests/test_lab_subject_match.py \
            tests/test_market_lane.py \
            tests/test_contract_wiring.py \
            tests/test_trademodel.py \
            tests/test_exammodel.py

          git status --short
          git commit -m "Merge main into max-maturity branch safely"
          merge_commit="$(git rev-parse HEAD)"
          echo "MERGE_COMMIT=${merge_commit}"

          remote_head="$(git ls-remote origin "refs/heads/$branch" | awk '{print $1}')"
          if [ "$remote_head" != "$start_head" ]; then
            echo "Remote branch moved from $start_head to $remote_head; refusing to overwrite concurrent work" >&2
            exit 1
          fi

          git push --force-with-lease="refs/heads/$branch:$start_head" origin "HEAD:refs/heads/$branch"
