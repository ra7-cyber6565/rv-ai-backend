name: Temporary PR81 semantic integration v3

on:
  push:
    branches:
      - integration/pr81-trading-on-pr111
    paths:
      - .github/workflows/temp-pr81-semantic-integration-v3.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/pr81-trading-on-pr111
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge PR81 and reconcile measured conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin fix/live-trading-acceptance-20260908
          set +e
          git merge --no-commit --no-ff origin/fix/live-trading-acceptance-20260908
          rc=$?
          set -e
          test "$rc" -ne 0
          conflicts="$(git diff --name-only --diff-filter=U | sort)"
          expected="$(printf '%s\n' research_engine/company_handoff_guard.py research_engine/craft_intent_guard.py scripts/run_pr81_trading_live_acceptance.py tests/test_company_handoff_guard.py tests/test_pr81_trading_live_acceptance.py tests/test_unified_max_mode.py | sort)"
          test "$conflicts" = "$expected"
          git checkout --ours research_engine/company_handoff_guard.py tests/test_company_handoff_guard.py
          git checkout --ours research_engine/craft_intent_guard.py tests/test_unified_max_mode.py
          git checkout --theirs scripts/run_pr81_trading_live_acceptance.py tests/test_pr81_trading_live_acceptance.py
          python tools/integrate_pr81_on_current.py
          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"
          git commit -m "merge: integrate PR81 trading and Max cross-review repairs"
          test -z "$(git status --porcelain)"
      - name: Install dependencies
        run: |
          python -m pip install -q -r requirements.txt
          python -m pip install -q pytest
      - name: Run focused PR81 and structured-handoff regressions
        run: |
          python -m pytest -q tests/test_company_cross_review.py tests/test_company_handoff_guard.py tests/test_company_handoff_runtime_wiring.py tests/test_company_handoff_structured_compaction.py tests/test_craft_technical_script_guard.py tests/test_hosted_live_gate.py tests/test_live_failure_diagnostics.py tests/test_live_result_summary.py tests/test_pr81_trading_live_acceptance.py tests/test_pr81_worker_diagnostics.py tests/test_task_contract_measured_coverage.py tests/test_trading_hypothesis_structure_guard.py tests/test_trading_threshold_guard.py tests/test_unified_max_mode.py
      - name: Run full pytest regression
        run: python -m pytest -q
      - name: Run legacy strict research-engine regression
        run: python test_research_engine.py
      - name: Push only after all gates pass
        run: git push origin HEAD:integration/pr81-trading-on-pr111
