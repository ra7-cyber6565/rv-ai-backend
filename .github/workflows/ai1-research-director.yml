name: AI-1 Research Director Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai1-research-director-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai1-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ZERO_COST_ONLY: "true"
      GEMINI_API_KEY: ""
      GEMINI_ZERO_COST_CONFIRMED: "false"
      INFINITY_OFFLINE_TEST: "true"
    steps:
      - name: Checkout proposed code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install repository test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile AI-1 + deep-source integration
        run: |
          python -m py_compile \
            research_engine/ai1_research_director.py \
            research_engine/ai1_packet_extensions.py \
            research_engine/deep_source_integrity.py \
            research_engine/critical_source_anatomy.py \
            research_engine/source_capability_matrix.py \
            research_engine/public_documentation_reader.py \
            research_engine/multilingual_source_provenance.py \
            research_engine/connectors/media_connector.py \
            research_engine/connectors/code_repository_connector.py \
            research_engine/connectors/thesis_connector.py \
            research_engine/connectors/archive_connector.py \
            research_engine/structured_source_reader.py \
            research_engine/ai1_structured_runtime.py \
            research_engine/network_safety.py \
            research_engine/agent_manager.py

      - name: Run AI-1 fail-closed + deep-source adversarial tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/test_ai1_research_director.py \
            tests/test_ai1_deep_source_integrity.py \
            tests/test_ai1_structured_source_runtime.py \
            tests/test_ai1_source_family_completeness.py \
            tests/test_ai1_final_source_runtime_coverage.py \
            tests/test_ai1_capability_receipt_hardening.py \
            tests/test_caption_content_type.py \
            2>&1 | tee ai1-test-output.txt

      - name: Correct obsolete media discovery comment once
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/ai1-audit-hardening'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('research_engine/source_discovery.py')
          text = path.read_text(encoding='utf-8')
          old = "\n".join((
              "        # Video/audio ka lane bhi ALAG hai (#133b). Book lane CATALOGUE deta hai",
              "        # aur classics lane MOOL TEXT — ye lane un dono se alag cheez laata hai:",
              "        # kisi lecture/interview/recording ka LIKHA HUA parichay. Media khud",
              "        # padha nahi jaata (na dekha, na suna), isliye har record par",
              "        # `read_level=\"snippet\"` hi rehta hai. Ye lane sirf craft-study tier se",
              "        # chalta hai, aur wahan bhi tab jab planner ne `craft_study` bhara ho.",
          )) + "\n"
          new = "\n".join((
              "        # Video/audio lane bhi ALAG hai (#133b). Production MediaConnector",
              "        # public VTT/SRT caption mile to transcript text process kar sakta hai;",
              "        # caption na mile to record description/snippet-only hi rehta hai. Media",
              "        # file khud kabhi download/dekhi/suni nahi jaati. Base SourceDiscovery",
              "        # ise study lanes me use karta hai; AI1StructuredSourceDiscovery alag se",
              "        # relevance-gated general transcript/media-intent lane add karta hai.",
          )) + "\n"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one stale media block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          if git diff --quiet -- research_engine/source_discovery.py; then
            echo "No stale comment diff produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_engine/source_discovery.py
          git commit -m "Correct stale media discovery truth comment"
          git push origin HEAD:${{ github.head_ref }}

      - name: Upload focused test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai1-test-output-${{ github.run_id }}
          path: ai1-test-output.txt
          if-no-files-found: warn
          retention-days: 1
