name: AI-1 Research Director Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai1-research-director-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai1-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ZERO_COST_ONLY: "true"
      GEMINI_API_KEY: ""
      GEMINI_ZERO_COST_CONFIRMED: "false"
      INFINITY_OFFLINE_TEST: "true"
    steps:
      - name: Checkout proposed code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install repository test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile AI-1 integration
        run: |
          python -m py_compile \
            research_engine/ai1_research_director.py \
            research_engine/agent_manager.py

      - name: Run AI-1 fail-closed contract tests
        run: pytest -q tests/test_ai1_research_director.py
