name: Foundation tests

on:
  pull_request:
    branches: [main]
  push:
    # PR checks should prevent bad merges once branch protection is enabled;
    # this second line also detects any accidental/admin direct main push.
    branches: [main, chatgpt-upload-safety]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-regression:
    # Public-repository standard GitHub-hosted runner; no larger/paid runner.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ZERO_COST_ONLY: "true"
      RATE_LIMIT_ENABLED: "true"
      # `runner` context is not valid in jobs.<job_id>.env; this job is Linux-only.
      INFINITY_DATA_ROOT: /tmp/rv-ai-infinity-data
      GEMINI_API_KEY: ""
      GEMINI_ZERO_COST_CONFIRMED: "false"
      CLOUD_ARCHIVE_PROVIDER: "none"
      INFINITY_OFFLINE_TEST: "true"
    steps:
      - name: Checkout exact integration head
        uses: actions/checkout@v7
        with:
          # Pull-request jobs normally checkout GitHub's synthetic merge commit.
          # Release receipts must identify the exact code commit we are signing
          # off, so test the PR head itself; push jobs fall back to github.sha.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # Pin the stress-test failures as an explicit release-critical gate. The
      # full Foundation runner below still executes the complete tests/ suite;
      # this named stage makes regressions in research semantics immediately
      # visible instead of hiding them inside a large aggregate pytest failure.
      - name: Run advanced research quality regression gate
        run: |
          pytest -q \
            tests/test_advanced_research_quality.py \
            tests/test_evidence_axis_guard.py \
            tests/test_advanced_semantic_coverage.py \
            tests/test_final_stress_hardening.py \
            tests/test_source_family_query_fairness.py \
            tests/test_specialist_lane_quality.py \
            tests/test_controversial_text_lane.py \
            tests/test_hypothesis_evidence_lineage.py \
            tests/test_quality_metric_ui.py \
            tests/test_causal_chain_quality.py \
            tests/test_ui_hygiene.py

      # #40/#103 are production extensions, not optional demo files. Keep their
      # bridge/safety/maturity invariants visible as their own fast CI gate in
      # addition to the complete pytest pass below. #103 includes an independent
      # depth/relevance/source-quality readiness guard so snippets or weak current
      # sources cannot fake DEBATE_MAP_READY.
      - name: Run advanced integration release gate
        run: |
          pytest -q \
            tests/test_advanced_discovery_extensions.py \
            tests/test_capability_maturity.py \
            tests/test_literature_debate.py \
            tests/test_literature_debate_guard.py \
            tests/test_triple_implementation.py \
            tests/test_triple_task_adapter.py \
            tests/test_triple_verification_bridge.py \
            tests/test_advanced_integration_release_gate.py
          python scripts/audit_advanced_integration.py

      # Keep CI and the user's Windows laptop on exactly the same release gate.
      # The runner itself compiles sources, runs focused integration tests,
      # test_research_engine.py, every standalone tests/test_*.py file, and the
      # offline superconductivity Benchmark V2. It continues after individual
      # failures so one run exposes the complete failure set, then exits nonzero.
      - name: Run strict zero-cost foundation gate
        run: |
          python scripts/run_foundation_gate.py \
            --timeout-seconds 900 \
            --receipt "${INFINITY_DATA_ROOT}/audit/foundation_gate_ci.json"

      # Keep the machine-readable stage/tail report when the strict gate reaches
      # receipt generation. If an earlier release-critical stage fails first,
      # absence of the receipt is expected and must not mask the original error.
      - name: Upload foundation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-gate-receipt-${{ github.run_id }}
          path: /tmp/rv-ai-infinity-data/audit/foundation_gate_ci.json
          if-no-files-found: warn
          retention-days: 1
