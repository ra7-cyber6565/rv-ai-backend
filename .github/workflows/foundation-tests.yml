name: Foundation tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [chatgpt-upload-safety]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-regression:
    # Public-repository standard GitHub-hosted runner; no larger/paid runner.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ZERO_COST_ONLY: "true"
      RATE_LIMIT_ENABLED: "true"
      # `runner.*` context is not available while GitHub validates job-level
      # env, which caused instant no-job workflow failures. A fixed path on the
      # ephemeral Ubuntu standard runner is deterministic and still zero-cost.
      INFINITY_DATA_ROOT: /tmp/infinity-research-ai-gate
      GEMINI_API_KEY: ""
      GEMINI_ZERO_COST_CONFIRMED: "false"
      CLOUD_ARCHIVE_PROVIDER: "none"
      INFINITY_OFFLINE_TEST: "true"
    steps:
      - name: Checkout integrated branch/PR code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # Keep CI and the user's Windows laptop on exactly the same release gate.
      # The runner itself compiles sources, runs focused integration tests,
      # the full pytest suite, legacy/core harnesses, provider/architecture
      # audits, the 8-domain benchmark and superconductivity Benchmark V2.
      - name: Run strict zero-cost foundation gate
        run: |
          python scripts/run_foundation_gate.py \
            --timeout-seconds 900 \
            --receipt "${INFINITY_DATA_ROOT}/audit/foundation_gate_ci.json"
