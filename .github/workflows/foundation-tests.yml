name: Foundation tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-regression:
    # Public-repository standard GitHub-hosted runner; no larger/paid runner.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ZERO_COST_ONLY: "true"
      RATE_LIMIT_ENABLED: "true"
      INFINITY_DATA_ROOT: ${{ runner.temp }}/infinity-data
      GEMINI_API_KEY: ""
      CLOUD_ARCHIVE_PROVIDER: "none"
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run infrastructure and zero-cost regression
        run: |
          pytest -q \
            tests/test_upload_safety.py \
            tests/test_work_root.py \
            tests/test_storage_paths.py \
            tests/test_storage_quota.py \
            tests/test_archive_manifest.py \
            tests/test_archive_manifest_concurrency.py \
            tests/test_archive_retry.py \
            tests/test_cloud_storage.py \
            tests/test_cloud_archive.py \
            tests/test_process_lock.py \
            tests/test_google_drive_rclone.py \
            tests/test_provider_factory.py \
            tests/test_zero_cost_guard.py \
            tests/test_security_config.py \
            tests/test_request_guard.py \
            tests/test_research_jobs.py

      - name: Independently test Claude research hardening
        run: |
          pytest -q \
            tests/test_relevance_domain.py \
            tests/test_domain_guardrails.py \
            tests/test_domain_ambiguity.py \
            tests/test_pdf_chunking.py \
            tests/test_pdf_sparse_sampling.py \
            tests/test_consensus_gate.py \
            tests/test_gemini_retry.py \
            tests/test_pipeline_offline.py \
            tests/test_answer_structure.py \
            tests/test_claim_labels.py \
            tests/test_evidence_honesty.py \
            tests/test_explain_style.py

      - name: Run claim evidence verification A-E
        run: |
          pytest -q \
            tests/test_evidence_verification.py \
            tests/test_claim_label_ae_gate.py \
            tests/test_verification_fail_closed.py

      - name: Run user's human-first presentation contract
        run: |
          pytest -q \
            tests/test_user_presentation_contract.py \
            tests/test_presentation_guard.py

      - name: Run core offline regression
        run: python test_research_engine.py

      - name: Run standalone offline test files
        shell: bash
        run: |
          set -euo pipefail
          for file in tests/test_*.py; do
            echo "=== $file ==="
            python "$file"
          done
