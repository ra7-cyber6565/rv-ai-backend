name: Temporary PR64 integration validation

on:
  push:
    branches:
      - integration/pr64-local-fallback-on-pr103
    paths:
      - .github/workflows/temp-pr64-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/pr64-local-fallback-on-pr103
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create clean local PR64 merge commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin chatgpt-local-fallback-safety-20260902
          git merge --no-commit --no-ff origin/chatgpt-local-fallback-safety-20260902
          test -z "$(git diff --name-only --diff-filter=U)"
          git commit -m "merge: integrate local fallback source guard"
          test -z "$(git status --porcelain)"
      - name: Preserve current question-only evidence exclusion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('research_engine/local_reasoning_guard.py')
          text = path.read_text(encoding='utf-8')
          old = "    for sent in _safe_sentences(source):\n        score = _local._score_sentence(sent, terms)\n"
          new = "    for sent in _safe_sentences(source):\n        # Preserve the current evidence-before-generation rule: a source that\n        # merely asks the user's question has not supplied an explanation.\n        if sent.rstrip().endswith(('?', '？')):\n            continue\n        score = _local._score_sentence(sent, terms)\n"
          if old not in text:
              raise SystemExit('expected safe sentence loop anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git add research_engine/local_reasoning_guard.py
          git commit -m "fix: preserve question-only evidence exclusion in fallback guard"
          test -z "$(git status --porcelain)"
      - name: Install repository and test dependencies
        run: |
          python -m pip install -q -r requirements.txt
          python -m pip install -q pytest
      - name: Run focused local fallback safety tests
        run: |
          python -m pytest -q \
            tests/test_local_reasoning_source_guard.py \
            tests/test_p0b_evidence_before_generation.py
      - name: Run full pytest regression
        run: python -m pytest -q
      - name: Run legacy strict research-engine regression
        run: python test_research_engine.py
      - name: Push validated integration merge only after all gates pass
        shell: bash
        run: git push origin HEAD:integration/pr64-local-fallback-on-pr103
