name: Model reality attestors

on:
  pull_request:
    branches: [main]
  push:
    branches: [chatgpt-max-maturity-wave1-20260827]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-reality-attestors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  specialized-attestors:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: "."
      ZERO_COST_ONLY: "true"
      GEMINI_API_KEY: ""
      GEMINI_ZERO_COST_CONFIRMED: "false"
      INFINITY_OFFLINE_TEST: "true"
    steps:
      - name: Checkout exact integrated revision
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run specialized model and reality attestor regressions
        run: |
          pytest -q \
            tests/test_neural_symbolic_hybrid.py \
            tests/test_neural_symbolic_execution_attestor.py \
            tests/test_world_model.py \
            tests/test_world_model_execution_attestor.py \
            tests/test_physical_reality.py \
            tests/test_physical_reality_execution_attestor.py \
            tests/test_manufacturing_reality.py \
            tests/test_manufacturing_reality_attestor.py \
            tests/test_maturity_attestation_readiness.py
