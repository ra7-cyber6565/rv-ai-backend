name: Temporary dispatch PR113 trading live acceptance

on:
  push:
    branches:
      - test/dispatch-pr113-zero-cost-probe
    paths:
      - .github/workflows/temp-dispatch-pr113-trading-live.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch reviewed PR113 trading live gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          payload='{"ref":"integration/pr81-trading-on-pr111"}'
          code=$(curl --silent --show-error --output /tmp/dispatch.out --write-out '%{http_code}' \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPO}/actions/workflows/pr81-trading-live-acceptance.yml/dispatches" \
            --data "$payload")
          if [ "$code" != "204" ]; then
            echo "workflow dispatch failed with HTTP $code" >&2
            exit 2
          fi
          echo "Exact reviewed PR113 trading live gate dispatched."
