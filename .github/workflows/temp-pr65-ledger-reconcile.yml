name: Temporary PR65 proof-ledger reconciliation

on:
  push:
    branches:
      - integration/pr65-maturity-on-pr106-v2
    paths:
      - .github/workflows/temp-pr65-ledger-reconcile.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/pr65-maturity-on-pr106-v2
      - name: Bind replication receipt to current proof-ledger subject digest
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('research_engine/replication_independence_attestor.py')
          text = path.read_text(encoding='utf-8')
          old = '''    ledger = ProofLedger(str(ledger_target), integrity_key=integrity_key)\n    existing = _existing_adds(ledger)\n    receipt_id = f"repind:{receipt.sha256[:16]}:{_CAPABILITY_ID}"\n    reference = f"{_REFERENCE_PREFIX}{observation}:{receipt.campaign_hash[:16]}"\n    expected = {\n        "capability_id": _CAPABILITY_ID,\n        "proof_kind": _PROOF_KIND.value,\n        "subject": _SUBJECT,\n        "verifier": _VERIFIER,\n        "reference": reference,\n        "implementation_revision": revision,\n    }\n'''
          new = '''    implementation_sha256 = _hash_tracked_regular(\n        root, tracked, _IMPLEMENTATION_SUBJECT\n    )\n    subject_sha256 = _sha({\n        "revision": revision,\n        "execution_receipt_sha256": receipt.sha256,\n        "campaign_hash": receipt.campaign_hash,\n        "protocol_hash": receipt.protocol_hash,\n        "group_manifest_hash": receipt.group_manifest_hash,\n        "implementation_sha256": implementation_sha256,\n        "proof_kind": _PROOF_KIND.value,\n    })\n    ledger = ProofLedger(str(ledger_target), integrity_key=integrity_key)\n    existing = _existing_adds(ledger)\n    receipt_id = f"repind:{receipt.sha256[:16]}:{_CAPABILITY_ID}"\n    reference = f"{_REFERENCE_PREFIX}{observation}:{receipt.campaign_hash[:16]}"\n    expected = {\n        "capability_id": _CAPABILITY_ID,\n        "proof_kind": _PROOF_KIND.value,\n        "subject": _SUBJECT,\n        "subject_sha256": subject_sha256,\n        "verifier": _VERIFIER,\n        "reference": reference,\n        "implementation_revision": revision,\n    }\n'''
          if old not in text:
              raise SystemExit('replication receipt binding anchor not found')
          text = text.replace(old, new, 1)
          old_add = '''            proof_kind=_PROOF_KIND,\n            subject=_SUBJECT,\n            verifier=_VERIFIER,\n'''
          new_add = '''            proof_kind=_PROOF_KIND,\n            subject=_SUBJECT,\n            subject_sha256=subject_sha256,\n            verifier=_VERIFIER,\n'''
          if old_add not in text:
              raise SystemExit('replication ledger.add anchor not found')
          path.write_text(text.replace(old_add, new_add, 1), encoding='utf-8')
          PY
      - name: Commit reconciliation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_engine/replication_independence_attestor.py
          git commit -m "fix: bind replication independence proof subject digest"
          git push origin HEAD:integration/pr65-maturity-on-pr106-v2
