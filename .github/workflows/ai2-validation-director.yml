name: AI-2 Validation Director Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai2-validation-director-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai2-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ZERO_COST_ONLY: "true"
      GEMINI_API_KEY: ""
      GEMINI_ZERO_COST_CONFIRMED: "false"
      INFINITY_OFFLINE_TEST: "true"
    steps:
      - name: Checkout proposed code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install repository test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile AI-1 plus AI-2 integration
        run: |
          python -m py_compile \
            research_engine/ai1_research_director.py \
            research_engine/validation_contracts.py \
            research_engine/validation_experiments.py \
            research_engine/validation_statistics.py \
            research_engine/validation_inference.py \
            research_engine/validation_risk.py \
            research_engine/validation_trading.py \
            research_engine/validation_director.py \
            research_engine/agent_manager.py

      - name: Run all AI-2 focused fail-closed validation tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/test_validation_director.py \
            tests/test_ai2_*.py \
            2>&1 | tee ai2-test-output.txt

      - name: Re-run AI-1 focused tests for coexistence regression
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q tests/test_ai1_research_director.py 2>&1 | tee ai1-coexistence-output.txt

      - name: Upload focused test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai2-validation-output-${{ github.run_id }}
          path: |
            ai2-test-output.txt
            ai1-coexistence-output.txt
          if-no-files-found: warn
          retention-days: 1
