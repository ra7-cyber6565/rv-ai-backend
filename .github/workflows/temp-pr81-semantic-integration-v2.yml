name: Temporary PR81 semantic integration v2

on:
  push:
    branches:
      - integration/pr81-trading-on-pr111
    paths:
      - .github/workflows/temp-pr81-semantic-integration-v2.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/pr81-trading-on-pr111
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge PR81 and resolve only measured conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin fix/live-trading-acceptance-20260908
          set +e
          git merge --no-commit --no-ff origin/fix/live-trading-acceptance-20260908
          merge_rc=$?
          set -e
          test "$merge_rc" -ne 0
          conflicts="$(git diff --name-only --diff-filter=U | sort)"
          expected="$(printf '%s\n' \
            research_engine/company_handoff_guard.py \
            research_engine/craft_intent_guard.py \
            scripts/run_pr81_trading_live_acceptance.py \
            tests/test_company_handoff_guard.py \
            tests/test_pr81_trading_live_acceptance.py \
            tests/test_unified_max_mode.py | sort)"
          test "$conflicts" = "$expected"

          git checkout --ours research_engine/company_handoff_guard.py tests/test_company_handoff_guard.py
          git checkout --ours research_engine/craft_intent_guard.py
          git checkout --theirs scripts/run_pr81_trading_live_acceptance.py tests/test_pr81_trading_live_acceptance.py
          git checkout --ours tests/test_unified_max_mode.py

          python - <<'PY'
          from pathlib import Path

          # Preserve the already-installed current wrapper chain. Historical PR81
          # used getattr(..., __company_cross_review_original__), but functools.wraps
          # can copy arbitrary function attributes onto newer compatibility guards,
          # which can accidentally unwrap/bypass lossless structured handoff logic.
          wiring = Path('research_engine/company_cross_review_wiring.py')
          text = wiring.read_text(encoding='utf-8')
          old = '''# Capture the already-installed canonical/compatibility functions once. This
# wiring delegates to them; it never reimplements Round 1 or handoff compaction.
_ORIGINAL_RUN_COMPANY = getattr(
    _company.run_company, "__company_cross_review_original__", _company.run_company
)
_ORIGINAL_CHIEF_HANDOFF = getattr(
    _company.chief_handoff, "__company_cross_review_original__", _company.chief_handoff
)
_ORIGINAL_ATTACH_COMPANY_PASSES = getattr(
    _company.attach_company_passes,
    "__company_cross_review_original__",
    _company.attach_company_passes,
)
_ORIGINAL_GET_DEPTH_CONFIG = getattr(
    _depth.get_depth_config, "__company_cross_review_original__", _depth.get_depth_config
)
_ORIGINAL_QUOTA_NOTE = getattr(
    _depth.quota_note, "__company_cross_review_original__", _depth.quota_note
)
_ORIGINAL_TO_DICT = getattr(
    _depth.DepthConfig.to_dict, "__company_cross_review_original__", _depth.DepthConfig.to_dict
)
'''
          new = '''# Capture the fully-installed current compatibility chain. Only unwrap a
# wrapper that was installed by *this module* itself (module reload case).
# Never trust a copied marker on another wrapper: functools.wraps copies
# __dict__, and doing so previously bypassed structured handoff compaction.
def _capture_base(fn):
    if (getattr(fn, "__module__", "") == __name__
            and getattr(fn, "__company_cross_review_wiring__", False)):
        return getattr(fn, "__company_cross_review_original__", fn)
    return fn


_ORIGINAL_RUN_COMPANY = _capture_base(_company.run_company)
_ORIGINAL_CHIEF_HANDOFF = _capture_base(_company.chief_handoff)
_ORIGINAL_ATTACH_COMPANY_PASSES = _capture_base(_company.attach_company_passes)
_ORIGINAL_GET_DEPTH_CONFIG = _capture_base(_depth.get_depth_config)
_ORIGINAL_QUOTA_NOTE = _capture_base(_depth.quota_note)
_ORIGINAL_TO_DICT = _capture_base(_depth.DepthConfig.to_dict)
'''
          if old not in text:
              raise SystemExit('cross-review base-capture anchor missing')
          wiring.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Install Round-2 after current technical/trading guards.
          craft = Path('research_engine/craft_intent_guard.py')
          text = craft.read_text(encoding='utf-8')
          marker = 'from .trading_acceptance_guard import install as _install_trading_acceptance_guard\n_install_trading_acceptance_guard()\n'
          addition = marker + '''\n# Unified Max Round-2 collaboration reuses the same Company workers and chief.\nfrom .company_cross_review_wiring import install as _install_company_cross_review_wiring\n_install_company_cross_review_wiring()\n'''
          if 'company_cross_review_wiring' not in text:
              if marker not in text:
                  raise SystemExit('craft acceptance wiring anchor missing')
              craft.write_text(text.replace(marker, addition, 1), encoding='utf-8')

          # Preserve current unified-Max tests while asserting PR81's 6+6+4 budget.
          test = Path('tests/test_unified_max_mode.py')
          text = test.read_text(encoding='utf-8')
          text = text.replace(
              'def test_maximum_activates_full_company_plus_when_model_layer_is_usable(monkeypatch):',
              'def test_maximum_activates_full_company_plus_and_round2_when_model_layer_is_usable(monkeypatch):',
              1,
          )
          old = '    assert maximum.gemini_calls == company_plus.gemini_calls == 10\n'
          new = '''    assert maximum.company_cross_review_agents == 6\n    assert company_plus.gemini_calls == 10\n    assert maximum.gemini_calls == 16\n    assert maximum.to_dict()["company_cross_review_agents"] == 6\n'''
          if old in text:
              text = text.replace(old, new, 1)
          old2 = '    assert maximum.company_agents == 0\n'
          if old2 in text and 'company_cross_review_agents == 0' not in text:
              text = text.replace(old2, old2 + '    assert maximum.company_cross_review_agents == 0\n', 1)
          test.write_text(text, encoding='utf-8')

          # Prove the Round-2 wrapper delegates to the bounded structured guard,
          # without relying on __module__ (functools.wraps intentionally rewrites it).
          runtime = Path('tests/test_company_handoff_runtime_wiring.py')
          text = runtime.read_text(encoding='utf-8')
          old = '''fn = research_company.chief_handoff\nprint(getattr(fn, "__module__", ""))\n'''
          new = '''fn = research_company.chief_handoff\noriginal = getattr(fn, "__company_cross_review_original__", None)\nprint(getattr(fn, "__module__", ""))\nprint(getattr(original, "__bounded_structured_handoff_guard__", False))\n'''
          if old not in text:
              raise SystemExit('runtime handoff probe anchor missing')
          text = text.replace(old, new, 1)
          old_assert = '    assert proc.stdout.strip().splitlines()[-1] == "research_engine.company_handoff_guard"\n'
          new_assert = '''    lines = proc.stdout.strip().splitlines()\n    assert lines[-2] == "research_engine.company_cross_review_wiring"\n    assert lines[-1] == "True"\n'''
          if old_assert not in text:
              raise SystemExit('runtime handoff assertion anchor missing')
          runtime.write_text(text.replace(old_assert, new_assert, 1), encoding='utf-8')

          # Current hosted gate calls run_trading_live(); expose PR81's stronger
          # evaluator as schema 3, without weakening checks or exposing raw details.
          runner = Path('scripts/run_pr81_trading_live_acceptance.py')
          text = runner.read_text(encoding='utf-8')
          if 'def run_trading_live()' not in text:
              anchor = '\n\ndef _write(path: Path, payload: Mapping[str, Any]) -> None:\n'
              facade = '''\n\ndef run_trading_live() -> Dict[str, Any]:\n    """Hosted-gate compatibility facade over the stronger PR81 Max evaluator."""\n    receipt = dict(evaluate_result(run_live()))\n    receipt["schema"] = 3\n    return receipt\n'''
              if anchor not in text:
                  raise SystemExit('trading compatibility insertion anchor missing')
              runner.write_text(text.replace(anchor, facade + anchor, 1), encoding='utf-8')

          hosted = Path('scripts/run_hosted_live_gate.py')
          text = hosted.read_text(encoding='utf-8')
          start = text.index('REQUIRED_TRADING_CHECKS = {')
          end = text.index('\n\n\ndef summarize_trading', start)
          stronger = '''REQUIRED_TRADING_CHECKS = {\n    "status_complete", "maximum_mode_executed", "coding_not_creative",\n    "six_workers_requested", "task_contract_complete", "threshold_provenance",\n    "trade_contract_ran", "critical_trade_contract", "no_chased_win_rate",\n    "trading_reality_boundaries", "three_structured_hypotheses",\n    "six_specialists_executed", "specialist_handoff_complete",\n    "company_accounting_complete", "chief_executed",\n    "implementation_build_executed", "no_false_replication",\n}'''
          text = text[:start] + stronger + text[end:]
          text = text.replace('record.get("schema") == 2', 'record.get("schema") == 3', 1)
          old_return = 'return {"schema": 2, "passed": record.get("passed") is True and all(row["passed"] for row in rows),'
          new_return = 'return {"schema": 3, "passed": record.get("passed") is True and all(row["passed"] for row in rows),'
          if old_return not in text:
              raise SystemExit('hosted trading receipt return anchor missing')
          hosted.write_text(text.replace(old_return, new_return, 1), encoding='utf-8')

          ht = Path('tests/test_hosted_live_gate.py')
          text = ht.read_text(encoding='utf-8')
          text = text.replace("{'schema':2,'passed':True,'checks':[", "{'schema':3,'passed':True,'checks':[")
          text = text.replace("{'schema':2,'passed':False,'checks':[", "{'schema':3,'passed':False,'checks':[")
          text = text.replace('{"schema": 2, "passed": True, "checks": [', '{"schema": 3, "passed": True, "checks": [')
          ht.write_text(text, encoding='utf-8')
          PY

          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"
          git commit -m "merge: integrate PR81 trading and Max cross-review repairs"
          test -z "$(git status --porcelain)"
      - name: Install dependencies
        run: |
          python -m pip install -q -r requirements.txt
          python -m pip install -q pytest
      - name: Run focused PR81 and structured-handoff regressions
        run: |
          python -m pytest -q \
            tests/test_company_cross_review.py \
            tests/test_company_handoff_guard.py \
            tests/test_company_handoff_runtime_wiring.py \
            tests/test_company_handoff_structured_compaction.py \
            tests/test_craft_technical_script_guard.py \
            tests/test_hosted_live_gate.py \
            tests/test_live_failure_diagnostics.py \
            tests/test_live_result_summary.py \
            tests/test_pr81_trading_live_acceptance.py \
            tests/test_pr81_worker_diagnostics.py \
            tests/test_task_contract_measured_coverage.py \
            tests/test_trading_hypothesis_structure_guard.py \
            tests/test_trading_threshold_guard.py \
            tests/test_unified_max_mode.py
      - name: Run full pytest regression
        run: python -m pytest -q
      - name: Run legacy strict research-engine regression
        run: python test_research_engine.py
      - name: Push only after all gates pass
        run: git push origin HEAD:integration/pr81-trading-on-pr111
