name: Temporary latest PR81 integration audit

on:
  push:
    branches:
      - integration/pr81-latest-on-pr113
    paths:
      - .github/workflows/temp-pr81-latest-integration.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/pr81-latest-on-pr113
          fetch-depth: 0
      - name: Capture exact semantic conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin fix/live-trading-acceptance-20260908
          if ! git cherry-pick 7b0a10de7831efbca342ee361ea5fd68170c3a6b; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            test "$conflicts" = "tests/test_company_handoff_runtime_wiring.py"
            git checkout --ours -- tests/test_company_handoff_runtime_wiring.py
            git add tests/test_company_handoff_runtime_wiring.py
            GIT_EDITOR=true git cherry-pick --continue
          fi
          set +e
          git cherry-pick 8febb75fc5ba7d66d2759ddb0bfdf845f14b84f8
          status=$?
          set -e
          test "$status" -ne 0
          mkdir -p conflict-snapshot
          git diff --name-only --diff-filter=U | tee conflict-snapshot/conflicts.txt
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            safe="${file//\//__}"
            git show ":1:$file" > "conflict-snapshot/${safe}.base" || true
            git show ":2:$file" > "conflict-snapshot/${safe}.current" || true
            git show ":3:$file" > "conflict-snapshot/${safe}.incoming" || true
          done < conflict-snapshot/conflicts.txt
      - name: Upload semantic conflict snapshot
        uses: actions/upload-artifact@v4
        with:
          name: pr81-runtime-conflicts-${{ github.run_id }}
          path: conflict-snapshot/
          if-no-files-found: error
          retention-days: 3
