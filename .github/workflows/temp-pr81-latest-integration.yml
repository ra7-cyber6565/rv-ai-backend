name: Temporary latest PR81 integration audit

on:
  push:
    branches:
      - integration/pr81-latest-on-pr113
    paths:
      - .github/workflows/temp-pr81-latest-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/pr81-latest-on-pr113
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply latest PR81 repairs with current-stack semantic resolutions
        shell: bash
        run: |
          set -euo pipefail
          BASE=43c411cad88b226be44892152c0fa624edd8b68e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin fix/live-trading-acceptance-20260908

          if ! git cherry-pick 7b0a10de7831efbca342ee361ea5fd68170c3a6b; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            test "$conflicts" = "tests/test_company_handoff_runtime_wiring.py"
            # Keep PR113's stronger lossless handoff wiring contract.
            git checkout --ours -- tests/test_company_handoff_runtime_wiring.py
            git add tests/test_company_handoff_runtime_wiring.py
            GIT_EDITOR=true git cherry-pick --continue
          fi

          set +e
          git cherry-pick 8febb75fc5ba7d66d2759ddb0bfdf845f14b84f8
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U | sort)"
            expected="$(printf '%s\n' research_engine/company_worker.py research_engine/gemini_reasoning.py research_engine/research_company.py utils/research_runtime.py | sort)"
            test "$conflicts" = "$expected"
            python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          def stage(number, path):
              return subprocess.check_output(["git", "show", f":{number}:{path}"], text=True)

          # company_worker: incoming cooperative generation window + current durable run deadline.
          path = "research_engine/company_worker.py"
          worker = stage(3, path)
          old = '        context = RunContext(RuntimeStore(wire["path"]), wire["project"], wire["run"]) if wire else None\n'
          new = ('        context = RunContext(RuntimeStore(wire["path"]), wire["project"], wire["run"],\n'
                 '                             deadline=wire.get("deadline")) if wire else None\n')
          assert old in worker
          Path(path).write_text(worker.replace(old, new, 1), encoding="utf-8")

          # research_company: preserve current runtime deadline and add the earlier
          # cooperative generation cutoff, never allowing either deadline to enlarge the other.
          path = "research_engine/research_company.py"
          company = stage(2, path)
          old = '    try:\n        payload = dict(payload)\n'
          new = ('    try:\n'
                 '        generation_deadline = time.time() + max(0.0, timeout - min(10.0, timeout / 10))\n'
                 '        payload = dict(payload, generation_deadline=generation_deadline)\n')
          assert old in company
          company = company.replace(old, new, 1)
          old = '            payload["runtime_context"] = dict(wire, deadline=deadline)\n'
          new = (old + '            payload["generation_deadline"] = min(payload["generation_deadline"], deadline)\n')
          assert old in company
          Path(path).write_text(company.replace(old, new, 1), encoding="utf-8")

          # research_runtime: retain durable quota + shared model cooldown and add
          # the independent cooperative generation window from PR81.
          path = "utils/research_runtime.py"
          runtime = stage(2, path)
          anchor = 'class ResearchCancelled(RuntimeBlocked):\n    pass\n\n\nclass ModelCooldownActive(RuntimeBlocked):\n'
          generation = '''class ResearchCancelled(RuntimeBlocked):
              pass


          class GenerationDeadline(RuntimeBlocked):
              """The cooperative worker window ended before another request dispatch."""


          _GENERATION_DEADLINE = contextvars.ContextVar("generation_deadline", default=None)


          @contextlib.contextmanager
          def generation_window(seconds):
              """Share one elapsed-time budget across discovery, retries and fallbacks.

              This cooperative limit complements the parent's hard process timeout; a
              non-cooperating SDK/process still has UNKNOWN accounting if it is killed.
              Nested scopes may shorten the window, never extend it.
              """
              deadline = time.monotonic() + max(0.0, float(seconds))
              outer = _GENERATION_DEADLINE.get()
              token = _GENERATION_DEADLINE.set(min(deadline, outer) if outer is not None else deadline)
              try:
                  yield
              finally:
                  _GENERATION_DEADLINE.reset(token)


          def generation_window_active():
              return _GENERATION_DEADLINE.get() is not None


          def bounded_request_timeout(seconds):
              deadline = _GENERATION_DEADLINE.get()
              if deadline is None:
                  return seconds
              remaining = deadline - time.monotonic()
              if remaining <= 0.1:
                  raise GenerationDeadline("worker generation window exhausted")
              return min(float(seconds), remaining)


          def bounded_http_timeout(connect, read):
              """Share remaining time between connection setup and a provider read."""
              if not generation_window_active():
                  return (connect, read)
              remaining = bounded_request_timeout(connect + read)
              connection = min(float(connect), remaining / 4)
              return (connection, min(float(read), remaining - connection))


          class ModelCooldownActive(RuntimeBlocked):
          '''
          # Dedent the embedded source while keeping class body indentation below.
          import textwrap
          generation = textwrap.dedent(generation)
          assert anchor in runtime
          runtime = runtime.replace(anchor, generation, 1)
          wait_anchor = '''def wait_for_model_retry(delay):
              """Cancellable wait within the existing run/worker deadline, no reservation."""
              if current() is None or not math.isfinite(delay) or delay < 0:
                  return False
              remaining = remaining_seconds()
          '''
          wait_new = '''def wait_for_model_retry(delay):
              """Cancellable wait within both run and cooperative generation deadlines."""
              if current() is None or not math.isfinite(delay) or delay < 0:
                  return False
              if generation_window_active():
                  try:
                      bounded = bounded_request_timeout(delay)
                  except GenerationDeadline:
                      return False
                  if bounded + 1e-9 < delay:
                      return False
              remaining = remaining_seconds()
          '''
          wait_anchor = textwrap.dedent(wait_anchor)
          wait_new = textwrap.dedent(wait_new)
          assert wait_anchor in runtime
          Path(path).write_text(runtime.replace(wait_anchor, wait_new, 1), encoding="utf-8")

          # gemini_reasoning: keep current model/key cooldown semantics and merge
          # PR81's deadline/admission accounting. Only the four measured conflict
          # blocks are resolved; all clean 8f changes stay as Git auto-merged them.
          path = Path("research_engine/gemini_reasoning.py")
          text = path.read_text(encoding="utf-8")
          pattern = re.compile(r'^<<<<<<< .*?\n(.*?)^=======\n(.*?)^>>>>>>> .*?\n', re.M | re.S)
          seen = 0

          dispatch = '''                from utils.research_runtime import (
              current, model_cooldown_scopes, ModelCooldownActive,
              reserve_request, remember_model_failure, remaining_seconds,
          )
          left = remaining_seconds()
          effective_timeout = min(request_timeout, left) if left is not None else request_timeout
          attempt_timeout = bounded_request_timeout(effective_timeout)
          scopes = model_cooldown_scopes("gemini", self.keys.active(), name) if current() else ()
          try:
              reserve_request("gemini", request_prompt, 6000, cooldown_scopes=scopes)
          except ModelCooldownActive as cooldown:
              # A sibling already observed this failure. No HTTP attempt,
              # reservation or success is invented for the skipped call.
              v = ErrorVerdict(kind=cooldown.kind, detail="shared_run_cooldown")
              self.ledger.add(name, tag, v, attempt=0)
              self.ledger.events[-1]["origin"] = "shared_run_cooldown"
              self.notes.append(f"{tag}: shared run cooldown ({v.kind}); model request skipped")
              if v.kind == AUTH:
                  return "", True
              if v.kind == DAILY_QUOTA:
                  key_level = True
              if v.kind == RATE_LIMIT:
                  recovery_times[name] = time.time() + cooldown.retry_after
              else:
                  recovery_times.pop(name, None)
              break
          counts_before_dispatch = (self.attempts, self.same_model_retries,
                                    self.switched_models, self.prompt_compactions,
                                    self.timeout_extensions)
          history_before_dispatch = len(history)
          # Count retries/switches/compactions only after an application request
          # lease exists. This preserves shared cooldown accounting and prevents
          # phantom retry counts when the cooperative window rejects dispatch.
          if name in history:
              self.same_model_retries += 1
          if history and name != history[-1]:
              self.switched_models += 1
          if compacted_for_model and not compaction_counted:
              self.prompt_compactions += 1
              compaction_counted = True
          if timeout_extended and not extension_counted:
              self.timeout_extensions += 1
              extension_counted = True
          history.append(name)
          '''
          dispatch = textwrap.dedent(dispatch)
          # Re-indent dedented block to the loop body.
          dispatch = ''.join(('                ' + line if line.strip() else line) for line in dispatch.splitlines(True))

          def resolve(match):
              nonlocal_seen[0] += 1
              ours, incoming = match.group(1), match.group(2)
              if "ModelCooldownActive" in ours and "attempt_timeout" in incoming:
                  return dispatch
              if "self.prompt_compactions += 1" in ours:
                  return incoming
              if "self.timeout_extensions += 1" in ours:
                  return incoming
              if "time.sleep" in ours and "bounded_request_timeout" in incoming:
                  return incoming
              raise AssertionError("unexpected gemini conflict")

          nonlocal_seen = [0]
          text = pattern.sub(resolve, text)
          assert nonlocal_seen[0] == 4
          redundant = '''                    from .gemini_model import generate as _generate
              from utils.research_runtime import remaining_seconds
              left = remaining_seconds()
              if left is not None:
                  request_timeout = min(request_timeout, left)
              response = _generate(
          '''
          redundant = textwrap.dedent(redundant)
          redundant = ''.join(('                    ' + line if line.strip() else line) for line in redundant.splitlines(True))
          replacement = '''                    from .gemini_model import generate as _generate
              response = _generate(
          '''
          replacement = textwrap.dedent(replacement)
          replacement = ''.join(('                    ' + line if line.strip() else line) for line in replacement.splitlines(True))
          assert redundant in text
          text = text.replace(redundant, replacement, 1)
          rollback = '''                    (self.attempts, self.same_model_retries, self.switched_models,
                       self.prompt_compactions, self.timeout_extensions) = counts_before_dispatch
              self.prompt_attempt_log.pop()
              raise
          '''
          rollback = textwrap.dedent(rollback)
          rollback = ''.join(('                    ' + line if line.strip() else line) for line in rollback.splitlines(True))
          rollback_new = rollback.replace('                    self.prompt_attempt_log.pop()\n',
                                          '                    del history[history_before_dispatch:]\n                    self.prompt_attempt_log.pop()\n')
          assert rollback in text
          text = text.replace(rollback, rollback_new, 1)
          assert '<<<<<<<' not in text and '>>>>>>>' not in text and '\n=======\n' not in text
          path.write_text(text, encoding="utf-8")
          PY
            git add research_engine/company_worker.py research_engine/gemini_reasoning.py \
              research_engine/research_company.py utils/research_runtime.py
            GIT_EDITOR=true git cherry-pick --continue
          fi

          # Keep current stack authority; the imported commits' branch-history docs are stale here.
          git restore --source="$BASE" -- AI_HANDOFF.md WORK_STATUS.md docs/INFINITY_REQUIREMENT_LEDGER.md
          git rm -f --ignore-unmatch docs/PR81_REVIEWED_GATES.md
          git add AI_HANDOFF.md WORK_STATUS.md docs/INFINITY_REQUIREMENT_LEDGER.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: preserve current integration authority"
          fi
          git diff --check
          test -z "$(git status --porcelain)"
      - name: Install repository and test dependencies
        run: |
          python -m pip install -q -r requirements.txt
          python -m pip install -q pytest
      - name: Run focused acceptance, deadline, cooldown and storage regressions
        run: |
          python -m pytest -q \
            tests/test_pr81_trading_live_acceptance.py \
            tests/test_pr81_live_failure_diagnostic.py \
            tests/test_pr81_worker_diagnostics.py \
            tests/test_company_cross_review.py \
            tests/test_company_handoff_runtime_wiring.py \
            tests/test_company_generation_window.py \
            tests/test_gemini_retry.py \
            tests/test_reasoning_router.py \
            tests/test_reasoning_router_integration.py \
            tests/test_company_handoff_guard.py \
            tests/test_research_company.py \
            tests/test_shared_model_cooldown.py \
            tests/test_research_runtime_storage_quota.py
      - name: Run full pytest regression
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --tb=short -ra 2>&1 | tee latest-pr81-pytest.log
      - name: Upload pytest receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latest-pr81-pytest-${{ github.run_id }}
          path: latest-pr81-pytest.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Run legacy strict research-engine regression
        shell: bash
        run: |
          set -o pipefail
          python test_research_engine.py 2>&1 | tee latest-pr81-legacy.log
      - name: Upload legacy receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latest-pr81-legacy-${{ github.run_id }}
          path: latest-pr81-legacy.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Push only fully validated integration
        shell: bash
        run: git push origin HEAD:integration/pr81-latest-on-pr113
