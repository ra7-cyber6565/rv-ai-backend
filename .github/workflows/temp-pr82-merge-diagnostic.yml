name: Temporary PR82 safe integration

on:
  push:
    branches:
      - integration/review-pr82-on-current-stack
    paths:
      - .github/workflows/temp-pr82-merge-diagnostic.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/review-pr82-on-current-stack
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge historical PR82 head without committing
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin codex/answer-scope-20260908
          git merge --no-commit --no-ff origin/codex/answer-scope-20260908
          test -z "$(git diff --name-only --diff-filter=U)"
      - name: Install repository and test dependencies
        run: |
          python -m pip install -q -r requirements.txt
          python -m pip install -q pytest
      - name: Run full pytest regression before integration commit
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --tb=short -ra 2>&1 | tee integration-pytest.log
      - name: Upload pytest diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr82-integration-pytest-${{ github.run_id }}
          path: integration-pytest.log
          if-no-files-found: error
          retention-days: 3
      - name: Run legacy strict research-engine regression
        run: python test_research_engine.py
      - name: Commit validated integration merge
        shell: bash
        run: |
          git commit -m "merge: integrate validated PR82 fixes into current stack"
          git push origin HEAD:integration/review-pr82-on-current-stack
