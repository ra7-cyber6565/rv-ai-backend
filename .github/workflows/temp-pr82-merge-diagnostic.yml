name: Temporary PR82 safe integration

on:
  push:
    branches:
      - integration/review-pr82-on-current-stack
    paths:
      - .github/workflows/temp-pr82-merge-diagnostic.yml

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/review-pr82-on-current-stack
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove checkout has no PR82 merge and starts clean
        shell: bash
        run: |
          test -z "$(git status --porcelain)"
          if git merge-base --is-ancestor 92388ad7850edd3933ebdf2325afcd014fead225 HEAD; then
            echo "PR82 head unexpectedly already integrated" >&2
            exit 2
          fi
      - name: Install repository and test dependencies
        run: |
          python -m pip install -q -r requirements.txt
          python -m pip install -q pytest
      - name: Run current-stack full pytest baseline
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --tb=short -ra 2>&1 | tee baseline-pytest.log
      - name: Upload baseline pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-stack-baseline-pytest-${{ github.run_id }}
          path: baseline-pytest.log
          if-no-files-found: error
          retention-days: 3
