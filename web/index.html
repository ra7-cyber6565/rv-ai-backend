<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Infinity Research AI</title>
<meta name="description" content="Simple chat aur source-based deep research.">
<style>
:root{color-scheme:light;--bg:#fff;--soft:#f7f7f8;--ink:#202123;--muted:#6b7280;--line:#e5e7eb;--brand:#10a37f;--warn:#fff7e8;--warnink:#845b14;--max:820px;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
header{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 16px;gap:12px;flex:0 0 auto}.brand{font-weight:750;display:flex;align-items:center;gap:9px}.logo{width:30px;height:30px;border-radius:9px;background:var(--brand);color:white;display:grid;place-items:center;font-size:13px}.modes{margin-left:auto;background:var(--soft);border-radius:10px;padding:4px;display:flex;gap:3px}.modes button{border:0;background:transparent;padding:7px 13px;border-radius:8px;font-weight:650;color:var(--muted);cursor:pointer}.modes button.on{background:white;color:var(--ink);box-shadow:0 1px 3px #0001}
.hint{font-size:12px;color:var(--muted);text-align:center;padding:6px 12px;border-bottom:1px solid #f1f1f1;flex:0 0 auto}
#scroll{flex:1;overflow:auto}#thread{max-width:var(--max);margin:auto;padding:24px 16px 120px}.welcome{text-align:center;max-width:590px;margin:11vh auto}.welcome h1{font-size:29px;margin:0 0 10px}.welcome p{color:var(--muted);margin:0}.chips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:22px}.chip{border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:10px 13px;cursor:pointer;font-size:14px}.chip:hover{border-color:var(--brand)}
.msg{display:flex;gap:12px;padding:15px 0}.av{width:30px;height:30px;flex:0 0 30px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:750}.user .av{background:#eef2f7}.rv .av{background:var(--brand);color:#fff}.body{min-width:0;flex:1}.txt{line-height:1.68;overflow-wrap:anywhere;white-space:normal}.txt p{margin:0 0 11px}.txt p:last-child{margin-bottom:0}
.thinking{display:inline-flex;gap:5px}.thinking i{width:7px;height:7px;border-radius:50%;background:#8b8b8b;animation:p 1.25s infinite}.thinking i:nth-child(2){animation-delay:.18s}.thinking i:nth-child(3){animation-delay:.36s}@keyframes p{0%,80%,100%{opacity:.25}40%{opacity:1}}
.progress{background:var(--soft);border:1px solid var(--line);border-radius:13px;padding:13px 14px}.stage{font-weight:650}.stagecount{font-size:12px;color:var(--muted);margin-top:5px}.bar{height:6px;border-radius:999px;background:#e5e7eb;margin:10px 0;overflow:hidden}.fill{height:100%;background:var(--brand);width:0;transition:width .35s}.log{font-size:12px;color:var(--muted);white-space:pre-wrap;max-height:105px;overflow:auto}.process{margin-top:14px;border:1px solid var(--line);border-radius:11px;background:var(--soft);padding:10px 12px}.process summary{cursor:pointer;font-weight:650}.process .meta{margin-top:7px}.process .log{margin-top:8px;max-height:180px}.note{margin-top:10px;background:var(--warn);color:var(--warnink);border:1px solid #f1deb6;border-radius:10px;padding:9px 11px;font-size:13px}.sources{margin-top:16px}.sources h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}.src{padding:10px 11px;border:1px solid var(--line);border-radius:10px;margin:7px 0}.src a{color:#08795f;text-decoration:none;font-weight:650}.src a:hover{text-decoration:underline}.meta{color:var(--muted);font-size:12px;margin-top:3px}
footer{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(transparent,#fff 24px);padding:26px 14px 12px}.composer{max-width:var(--max);margin:auto;border:1px solid var(--line);background:white;border-radius:17px;display:flex;align-items:flex-end;padding:8px 8px 8px 15px;box-shadow:0 3px 16px #0000000d}.composer:focus-within{border-color:var(--brand)}textarea{border:0;outline:0;resize:none;flex:1;font:inherit;line-height:1.5;max-height:180px;padding:7px 0;background:transparent}.send{width:38px;height:38px;border:0;border-radius:11px;background:var(--brand);color:#fff;font-size:19px;cursor:pointer}.send:disabled{opacity:.4;cursor:default}.foot{text-align:center;font-size:10px;color:var(--muted);margin-top:6px}
@media(max-width:600px){header{padding:0 7px}.brand span:last-child{display:none}.modes button{padding:7px 8px;font-size:12px}#thread{padding-left:12px;padding-right:12px}.welcome{margin-top:8vh}}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="logo">IR</span><span>Infinity Research AI</span></div>
  <div class="modes">
    <button class="on" data-mode="QUICK">Chat</button>
    <button data-mode="DEEP">Deep</button>
    <button data-mode="MAXIMUM">Max</button>
    <button data-mode="MARATHON">Marathon</button>
  </div>
</header>
<div class="hint" id="hint">Chat — turant seedha jawab.</div>
<div id="scroll"><main id="thread">
  <section class="welcome" id="welcome">
    <h1>Kya research karni hai?</h1>
    <p>Normal baat ke liye Chat. Sources aur cross-check ke liye Deep/Max; books, archives aur specialist lanes ke liye Marathon.</p>
    <div class="chips">
      <button class="chip" data-q="Explain black holes simply">Black holes simple words mein</button>
      <button class="chip" data-q="Room-temperature superconductors ka future evidence ke saath research karo">Superconductors research</button>
      <button class="chip" data-q="AI bias real world decisions ko kaise affect karta hai?">AI bias research</button>
    </div>
  </section>
</main></div>
<footer>
  <div class="composer"><textarea id="input" rows="1" placeholder="Kuch bhi poocho…" autofocus></textarea><button id="send" class="send" title="Bhejo">↑</button></div>
  <div class="foot">Important decisions ke liye sources aur evidence zaroor check karein.</div>
</footer>
<script>
"use strict";
const API="", IS_FILE=location.protocol==="file:";
const STAGES=["QUEUED","PLANNING","DISCOVERING","PROCESSING","READING","EVIDENCE_ANALYSIS","SPECIALIST_ANALYSIS","CRITIQUE","HYPOTHESIS","SYNTHESIS","SAFETY_CHECK","COMPLETE"];
const STAGE_LABEL={QUEUED:"Queue mein hai…",PLANNING:"Sawaal ko tod kar plan bana raha hoon",DISCOVERING:"Relevant sources dhoondh raha hoon",PROCESSING:"Documents process kar raha hoon",READING:"Available full text padh raha hoon",EVIDENCE_ANALYSIS:"Evidence check kar raha hoon",SPECIALIST_ANALYSIS:"Alag fields ke angle mila raha hoon",CRITIQUE:"Answer ko challenge kar raha hoon",HYPOTHESIS:"Testable ideas bana raha hoon",SYNTHESIS:"Final answer bana raha hoon",SAFETY_CHECK:"Aakhri check",COMPLETE:"Research complete"};
const HINT={QUICK:"Chat — turant seedha jawab.",DEEP:"Deep — sources + evidence + cross-check. Result background job mein banta hai.",MAXIMUM:"Max — gehri available research. Isme zyada time lag sakta hai.",MARATHON:"Marathon — multilingual books + official archives + alag evidence lanes. Background mein lamba chal sakta hai."};
let mode="QUICK",busy=false,sessionPromise=null;const history=[];const PROJECT={id:"",token:""};
const $=s=>document.querySelector(s),thread=$("#thread"),scroll=$("#scroll"),input=$("#input"),send=$("#send");
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
function htmlText(s){return esc(s).split(/\n{2,}/).map(p=>"<p>"+p.replace(/\n/g,"<br>")+"</p>").join("");}
function safeHttpUrl(raw){const text=String(raw??"").trim();if(!text)return "";try{const u=new URL(text,location.origin);return (u.protocol==="http:"||u.protocol==="https:")?u.href:"";}catch(_){return "";}}
function down(){scroll.scrollTop=scroll.scrollHeight;}
function row(role){const w=$("#welcome");if(w)w.remove();const el=document.createElement("div");el.className="msg "+role;el.innerHTML='<div class="av">'+(role==="user"?"You":"IR")+'</div><div class="body"><div class="txt"></div></div>';thread.appendChild(el);down();return el.querySelector(".txt");}
function thinking(el){el.innerHTML='<span class="thinking"><i></i><i></i><i></i></span>';}
function answer(el,text){el.innerHTML=htmlText(text);down();}
function note(el,text){const n=document.createElement("div");n.className="note";n.textContent=text;el.appendChild(n);}
function friendly(el,text){answer(el,IS_FILE?"Ye page file se khula hai. Backend server ke URL se page kholo, tab research chalegi.":(text||"Request safely complete nahi hui."));}
function clientFailure(status,data,area="Request",aborted=false){
  const code=Number(status||0),retryWait=Number(data?.retry_after_seconds||0),wait=retryWait>0?Math.max(1,Math.min(3600,retryWait)):0;
  if(aborted)return area+" ka safe wait-time khatam ho gaya. Question input mein wapas rakh diya hai; background research ya retry use karo.";
  if(code===429)return wait?area+" limit abhi busy hai. "+wait+" second baad retry karo.":area+" limit abhi busy hai; thoda ruk kar retry karo.";
  if(code===503)return "Backend ka private session/research layer ready nahi hai. Backend configuration aur writable data root check karna hoga.";
  if(code===401||code===403||code===404)return "Private session valid nahi rahi. Page refresh karke question dobara bhejo.";
  if(code>=500)return "Backend ne "+area.toLowerCase()+" complete nahi ki. Question input mein wapas rakh diya hai; backend health check ke baad retry karo.";
  if(!code)return "Backend tak network connection nahi ban paaya. Question input mein wapas rakh diya hai; backend chal raha ho to retry karo.";
  return area+" complete nahi hui (HTTP "+code+"). Question input mein wapas rakh diya hai.";
}
function restoreQuestion(message){if(!input.value.trim()){input.value=message;resize();}}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
async function jsonFetch(url,opts={},timeoutMs=0){
  const ctrl=("AbortController" in window)?new AbortController():null;let timer=null;
  if(ctrl&&timeoutMs>0)timer=setTimeout(()=>ctrl.abort(),timeoutMs);
  try{
    const request={...opts,cache:"no-store",signal:ctrl?ctrl.signal:undefined};
    const r=await fetch(url,request);const raw=await r.text();let data={};
    try{data=raw?JSON.parse(raw):{};}catch(_){data={};}
    return {r,data,aborted:false};
  }catch(e){return {r:{ok:false,status:0},data:{},aborted:!!(e&&e.name==="AbortError")};}
  finally{if(timer)clearTimeout(timer);}
}

function resetProjectSession(){PROJECT.id="";PROJECT.token="";sessionPromise=null;}
async function ensureSession(){
  if(PROJECT.id&&PROJECT.token)return PROJECT;
  if(sessionPromise)return sessionPromise;
  sessionPromise=(async()=>{
    const {r,data}=await jsonFetch(API+"/api/v1/session",{method:"POST"});
    if(!r.ok||!data.project_id||!data.project_access_token)throw new Error("private session unavailable");
    PROJECT.id=data.project_id;PROJECT.token=data.project_access_token;
    return PROJECT;
  })();
  try{return await sessionPromise;}catch(e){sessionPromise=null;throw e;}
}
function projectHeaders(){return {"Content-Type":"application/json","X-Project-Token":PROJECT.token};}
async function projectPost(url,makePayload,timeoutMs=0){
  // A backend redeploy may rotate an ephemeral project-signing file while this
  // tab still has the old in-memory capability. One 404 refresh is safe; never
  // loop forever and never put either capability in a URL.
  for(let attempt=0;attempt<2;attempt++){
    await ensureSession();
    const payload=makePayload(PROJECT.id);
    const out=await jsonFetch(API+url,{method:"POST",headers:projectHeaders(),body:JSON.stringify(payload)},timeoutMs);
    if(out.r.status!==404||attempt===1)return out;
    resetProjectSession();
  }
  throw new Error("project session recovery failed");
}

async function runChat(message,el){thinking(el);try{let out={r:{ok:false,status:0},data:{},aborted:false};for(let attempt=0;attempt<2;attempt++){out=await projectPost("/api/v1/chat",projectId=>({message,history,project_id:projectId}),55000);if(out.r.ok||![0,502,503,504].includes(Number(out.r.status||0))||attempt===1)break;await sleep(1500);}const {r,data}=out;if(!r.ok){friendly(el,clientFailure(r.status,data,"Chat",out.aborted));restoreQuestion(message);return false;}if(data.start_research_job===true){return await runResearch(message,el,"QUICK");}const text=data.answer||"Is run mein readable jawab nahi mila.";answer(el,text);history.push({role:"rv",content:text});return true;}catch(e){friendly(el,clientFailure(0,{},"Chat"));restoreQuestion(message);return false;}}

function progressPanel(el){el.innerHTML='<div class="progress"><div class="stage">Shuru kar raha hoon…</div><div class="stagecount">0/'+STAGES.length+' stages</div><div class="bar"><div class="fill"></div></div><div class="log"></div></div>';return {stage:el.querySelector(".stage"),count:el.querySelector(".stagecount"),fill:el.querySelector(".fill"),log:el.querySelector(".log")};}
function paintProgress(ui,p){if(!p||p.error)return;if(p.current_stage)ui.stage.textContent=STAGE_LABEL[p.current_stage]||p.current_stage;const done=Math.max(0,Number(p.stages_done||0));const total=Number(p.stages_total||STAGES.length);ui.count.textContent=done+"/"+total+" stages • "+Number(p.sources_discovered||0)+" sources • "+Number(p.full_text_sources_read||0)+" full-text";ui.fill.style.width=Math.min(100,Math.round(done/Math.max(1,total)*100))+"%";if(Array.isArray(p.log)&&p.log.length)ui.log.textContent=p.log.slice(-4).map(x=>"• "+(STAGE_LABEL[x.stage]||x.stage)+(x.note?" — "+x.note:"")).join("\n");down();}

async function runResearch(question,el,requestedMode=mode){const ui=progressPanel(el);let jobId="",jobToken="";try{
  const start=await projectPost("/api/v1/research-jobs",projectId=>({question,project_id:projectId,depth_mode:requestedMode}));
  if(!start.r.ok||!start.data.job_id||!start.data.job_access_token){friendly(el,clientFailure(start.r.status,start.data,"Research"));restoreQuestion(question);return false;}
  jobId=start.data.job_id;jobToken=start.data.job_access_token;
  const pollOpts={headers:{"X-Research-Job-Token":jobToken}};
  const hardDeadline=Date.now()+(requestedMode==="MARATHON"?60:30)*60*1000,stallMs=6*60*1000;let lastChange=Date.now(),lastSignature="";
  while(true){
    const status=await jsonFetch(API+"/api/v1/research-jobs/"+encodeURIComponent(jobId),pollOpts);
    if(!status.r.ok){friendly(el,clientFailure(status.r.status,status.data,"Research status"));restoreQuestion(question);return false;}
    const prog=await jsonFetch(API+"/api/v1/research-jobs/"+encodeURIComponent(jobId)+"/progress",pollOpts);
    if(prog.r.ok){const p=prog.data.progress||{};paintProgress(ui,p);const signature=[status.data.status,p.current_stage,p.stages_done,Array.isArray(p.log)?p.log.length:0].join("|");if(signature!==lastSignature){lastSignature=signature;lastChange=Date.now();}}
    if(status.data.status==="completed")break;
    if(status.data.status==="failed"||status.data.status==="interrupted"){friendly(el,"Research worker beech mein ruk gaya. Question input mein wapas rakh diya hai; naya background job start kar sakte ho.");restoreQuestion(question);return false;}
    if(Date.now()>hardDeadline){friendly(el,"Research browser ki wait-limit se lambi ho gayi. Job server par durable hai; page refresh ke baad status dobara check kiya ja sakta hai.");restoreQuestion(question);return false;}
    if(Date.now()-lastChange>stallMs){friendly(el,"Research progress 6 minute se badli nahi. Question input mein wapas rakh diya hai; server health check karke retry karo.");restoreQuestion(question);return false;}
    await sleep(1200);
  }
  const res=await jsonFetch(API+"/api/v1/research-jobs/"+encodeURIComponent(jobId)+"/result",pollOpts);
  if(!res.r.ok){friendly(el,clientFailure(res.r.status,res.data,"Research result"));restoreQuestion(question);return false;}renderResearch(el,res.data);return true;
}catch(e){friendly(el,clientFailure(0,{},"Research"));restoreQuestion(question);return false;}}

function appendResearchProcess(el,p){if(!p||p.available!==true)return;const details=document.createElement("details");details.className="process";const summary=document.createElement("summary");summary.textContent="Research process — "+Number(p.stages_done||0)+"/"+Number(p.stages_total||STAGES.length)+" stages";details.appendChild(summary);const meta=document.createElement("div");meta.className="meta";meta.textContent=Number(p.sources_discovered||0)+" sources • "+Number(p.full_text_sources_read||0)+" full-text • "+Number(p.evidence_conflicts_found||0)+" conflicts checked";details.appendChild(meta);if(Array.isArray(p.log)&&p.log.length){const log=document.createElement("div");log.className="log";log.textContent=p.log.map(x=>"• "+(STAGE_LABEL[x.stage]||x.stage)+(x.note?" — "+x.note:"")).join("\n");details.appendChild(log);}el.appendChild(details);}
function renderResearch(el,data){const text=data&&data.answer?data.answer:"Research complete hui, lekin readable answer nahi mila.";el.innerHTML=htmlText(text);history.push({role:"rv",content:text});appendResearchProcess(el,data?.research_progress);const sources=Array.isArray(data?.sources)?data.sources:[];if(sources.length){const box=document.createElement("div");box.className="sources";let h="<h4>Sources ("+sources.length+")</h4>";for(const s of sources.slice(0,15)){const title=esc(s.title||s.url||"Source"),href=safeHttpUrl(s.url),url=href?esc(href):"",read=esc(s.reading_level||s.access_level||"");h+='<div class="src">'+(url?'<a target="_blank" rel="noopener noreferrer nofollow" href="'+url+'">'+title+'</a>':'<strong>'+title+'</strong>')+(read?'<div class="meta">Read: '+read+'</div>':'')+'</div>';}box.innerHTML=h;el.appendChild(box);}if(data?.evidence_level)note(el,"Evidence status: "+data.evidence_level);if(data?.research_status&&data.research_status!=="COMPLETE")note(el,"Research status: "+data.research_status);down();}

async function submit(){const message=input.value.trim();if(!message||busy)return;busy=true;send.disabled=true;input.value="";resize();const u=row("user");u.textContent=message;history.push({role:"user",content:message});const r=row("rv");const completed=mode==="QUICK"?await runChat(message,r):await runResearch(message,r);if(!completed&&history.length&&history[history.length-1]?.role==="user")history.pop();busy=false;send.disabled=false;input.focus();}
function resize(){input.style.height="auto";input.style.height=Math.min(180,input.scrollHeight)+"px";}input.addEventListener("input",resize);input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();submit();}});send.addEventListener("click",submit);
document.querySelectorAll(".modes button").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".modes button").forEach(x=>x.classList.remove("on"));b.classList.add("on");mode=b.dataset.mode;$("#hint").textContent=HINT[mode];}));document.addEventListener("click",e=>{const c=e.target.closest(".chip");if(c){input.value=c.dataset.q;resize();submit();}});
if(IS_FILE){const r=row("rv");answer(r,"Backend server ke URL se page kholo. File:// mode mein research API available nahi hoti.");}
input.focus();
</script>
</body>
</html>
