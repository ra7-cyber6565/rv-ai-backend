services:
  - type: web
    name: rv-ai-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ZERO_COST_ONLY
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      # Set to true only after confirming the Google project/key has no paid
      # billing/spend path. ZERO_COST_ONLY intentionally fails closed otherwise.
      - key: GEMINI_ZERO_COST_CONFIRMED
        sync: false
    healthCheckPath: /health
